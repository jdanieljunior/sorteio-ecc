<title>Sorteio da Ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#0f1c33;
    --ink-soft:#465073;
    --ink-faint:#78829f;
    --paper:#e9eef7;
    --paper-raised:#ffffff;
    --paper-sunken:#dde5f2;
    --blue:#0d4da4;
    --blue-deep:#0a3b7d;
    --gold:#a9790a;
    --gold-deep:#8a6108;
    --gold-tint:#f3e5b8;
    --wine:#b40c1d;
    --wine-tint:#f6dadb;
    --good:#3f7d5c;
    --good-tint:#dcefe4;
    --line:#c3cee5;
    --line-soft:#d3ddef;
    --mast-1:#123a7a;
    --mast-2:#081b40;
    --shadow: 0 1px 2px rgba(18,32,60,.07), 0 8px 24px -12px rgba(18,32,60,.22);
    --stage-bg:#0b1120;
    --stage-bg2:#142544;
    --stage-ink:#f5efe0;
    --stage-gold:#f0c94a;
    --stage-red:#ef4b56;
    --stage-blue:#4d8fe0;
    --stage-good:#57c98a;
    --stage-line: rgba(240,201,74,.35);
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f1ece0; --ink-soft:#b7bcd6; --ink-faint:#828aab;
      --paper:#0d1526; --paper-raised:#152238; --paper-sunken:#0f1a2d;
      --blue:#5b9ce6; --blue-deep:#7fb2ef;
      --gold:#e0b64c; --gold-deep:#f3cf7a; --gold-tint:#3a2f14;
      --wine:#f16b74; --wine-tint:#3d1a1e;
      --good:#6ec498; --good-tint:#183226;
      --line:#2c3c5c; --line-soft:#20304c;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 28px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1ece0; --ink-soft:#b7bcd6; --ink-faint:#828aab;
    --paper:#0d1526; --paper-raised:#152238; --paper-sunken:#0f1a2d;
    --blue:#5b9ce6; --blue-deep:#7fb2ef;
    --gold:#e0b64c; --gold-deep:#f3cf7a; --gold-tint:#3a2f14;
    --wine:#f16b74; --wine-tint:#3d1a1e;
    --good:#6ec498; --good-tint:#183226;
    --line:#2c3c5c; --line-soft:#20304c;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 28px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
  button, input, textarea, select{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  button:disabled{cursor:not-allowed;opacity:.5;}
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;}
  :focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:4px;}
  ::selection{background:var(--gold-tint);}

  .app{max-width:920px;margin:0 auto;padding:24px 20px 80px;}

  /* ---------- masthead (fixed navy band, brand identity) ---------- */
  .masthead{background:linear-gradient(135deg,var(--mast-1),var(--mast-2));position:relative;overflow:hidden;padding:22px clamp(20px,4vw,calc((100vw - 920px)/2 + 20px));display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .masthead-watermark{position:absolute;top:50%;right:-40px;transform:translateY(-50%);width:220px;height:220px;background-repeat:no-repeat;background-position:center;background-size:contain;opacity:.09;pointer-events:none;}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;position:relative;z-index:1;}
  .brand-icon{flex:none;width:48px;height:48px;border-radius:50%;background:#fffaf0;border:2px solid var(--gold-tint);padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .brand-icon img{width:100%;height:100%;object-fit:contain;}
  .brand-text .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--stage-gold);font-weight:700;}
  .brand-text h1{font-size:24px;font-weight:600;color:#fdfbf3;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar-actions{display:flex;gap:8px;align-items:flex-start;position:relative;z-index:1;}
  .masthead .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fdfbf3;}
  .masthead .btn:hover:not(:disabled){background:rgba(255,255,255,.16);border-color:var(--stage-gold);}

  .btn{border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:9px 15px;border-radius:9px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s, background .15s;}
  .btn:hover:not(:disabled){border-color:var(--blue);}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:#f5f9ff;}
  .btn-primary:hover:not(:disabled){background:var(--blue-deep);border-color:var(--blue-deep);}
  .btn-red{background:var(--wine);border-color:var(--wine);color:#fff8f2;box-shadow:0 6px 18px -8px rgba(180,12,29,.6);}
  .btn-red:hover:not(:disabled){filter:brightness(1.08);}
  .btn-good{background:var(--good);border-color:var(--good);color:#f3fff8;}
  .btn-good:hover:not(:disabled){filter:brightness(1.08);}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover:not(:disabled){background:var(--paper-sunken);}
  .btn-wine{color:var(--wine);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-icon{padding:9px;}

  .menu-panel{position:absolute;top:calc(100% + 8px);right:0;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:240px;padding:8px;z-index:40;}
  .menu-panel .menu-item{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:none;border:none;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink);}
  .menu-panel .menu-item:hover{background:var(--paper-sunken);}
  .menu-panel .menu-sep{height:1px;background:var(--line-soft);margin:6px 2px;}
  .menu-panel .menu-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);padding:6px 10px 2px;font-weight:700;}
  .raffle-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .raffle-row .raffle-meta{min-width:0;}
  .raffle-row .raffle-meta .rname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .raffle-row .raffle-meta .rstat{font-size:11.5px;color:var(--ink-faint);}
  .raffle-row.active{background:var(--gold-tint);}
  .icon-del{flex:none;color:var(--ink-faint);padding:4px;border-radius:6px;}
  .icon-del:hover{color:var(--wine);background:var(--wine-tint);}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{position:relative;background:none;border:none;padding:12px 6px;margin-right:22px;font-size:14.5px;font-weight:700;color:var(--ink-faint);font-family:var(--font-body);}
  .tab .tab-num{display:inline-block;font-family:var(--font-mono);font-size:11px;background:var(--paper-sunken);color:var(--ink-soft);border-radius:5px;padding:1px 6px;margin-right:8px;}
  .tab.active{color:var(--ink);}
  .tab.active .tab-num{background:var(--blue);color:#fff;}
  .tab.active::after{content:"";position:absolute;left:0;right:22px;bottom:-1px;height:2.5px;background:var(--blue);border-radius:2px;}
  .tab:disabled{color:var(--ink-faint);opacity:.45;}

  /* ---------- generic ---------- */
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);}
  .stack{display:flex;flex-direction:column;gap:18px;}
  .section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);font-weight:800;margin-bottom:4px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .hint{font-size:12.5px;color:var(--ink-faint);}
  input[type="text"], input[type="number"], textarea{
    width:100%;background:var(--paper-sunken);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14.5px;color:var(--ink);
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus{border-color:var(--blue);}
  textarea{resize:vertical;min-height:78px;font-family:var(--font-mono);font-size:13.5px;line-height:1.6;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}
  .banner{border-radius:10px;padding:11px 14px;font-size:13.5px;font-weight:600;display:flex;gap:9px;align-items:flex-start;}
  .banner-warn{background:var(--gold-tint);color:var(--gold-deep);}
  .banner-good{background:var(--good-tint);color:var(--good);}
  .empty{text-align:center;padding:52px 20px;color:var(--ink-faint);}
  .empty h3{color:var(--ink);font-size:19px;margin-bottom:8px;}

  /* ---------- prizes editor ---------- */
  .prize-edit-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--paper);}
  .prize-photo{flex:none;width:56px;height:56px;border-radius:10px;background:var(--paper-sunken);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-faint);position:relative;}
  .prize-photo img{width:100%;height:100%;object-fit:cover;}
  .prize-photo input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .prize-order{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-tint);color:var(--gold-deep);font-family:var(--font-mono);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .prize-edit-row input[type=text]{flex:1;}

  /* ---------- pool ---------- */
  .pool-summary{display:flex;flex-wrap:wrap;gap:22px;padding:14px 16px;background:var(--paper-sunken);border-radius:10px;}
  .pool-stat .num{font-family:var(--font-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .pool-stat .lab{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .pool-ranges{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);word-break:break-word;}
  .pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:220px;overflow-y:auto;padding:12px;background:var(--paper-sunken);border-radius:10px;}
  .pool-chip{font-family:var(--font-mono);font-size:12.5px;text-align:center;background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:6px;padding:4px 2px;font-variant-numeric:tabular-nums;}

  /* ---------- ticket component ---------- */
  .ticket{position:relative;display:flex;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .ticket-stub{flex:none;width:104px;border-right:2px dashed var(--line);display:flex;align-items:center;justify-content:center;padding:14px;position:relative;background:var(--paper-sunken);}
  .ticket-stub img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;}
  .ticket-stub .ph{color:var(--gold);opacity:.55;}
  .ticket::before, .ticket::after{content:"";position:absolute;left:104px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--paper);z-index:2;}
  .ticket::before{top:-8px;}
  .ticket::after{bottom:-8px;}
  .ticket-body{flex:1;min-width:0;padding:16px 18px;display:flex;flex-direction:column;gap:8px;justify-content:center;}
  .ticket-order{font-family:var(--font-mono);font-size:11px;color:var(--gold-deep);font-weight:700;letter-spacing:.05em;}
  .ticket-name{font-family:var(--font-display);font-size:19px;font-weight:600;}
  .ticket-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

  .winner-badge{display:inline-flex;flex-direction:column;line-height:1.15;}
  .winner-num{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--wine);font-variant-numeric:tabular-nums;}
  .winner-time{font-size:11px;color:var(--ink-faint);}
  .stamp{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--wine);color:var(--wine);border-radius:7px;padding:3px 9px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg);}
  .stamp-warn{border-color:var(--gold-deep);color:var(--gold-deep);}
  .stamp-good{border-color:var(--good);color:var(--good);}

  .progress-track{height:8px;border-radius:5px;background:var(--paper-sunken);overflow:hidden;}
  .progress-fill{height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px, var(--gold-deep) 6px 8px);transition:width .4s ease;}

  /* ---------- results table ---------- */
  .result-row{display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--line-soft);}
  .result-row:last-child{border-bottom:none;}
  .result-thumb{flex:none;width:42px;height:42px;border-radius:8px;background:var(--paper-sunken);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--gold);}
  .result-thumb img{width:100%;height:100%;object-fit:cover;}
  .result-order{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
  .result-name{font-weight:700;font-size:14.5px;}
  .result-num{margin-left:auto;font-family:var(--font-mono);font-weight:700;font-size:17px;color:var(--wine);font-variant-numeric:tabular-nums;}
  .letterhead{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
  .letterhead img{width:44px;height:44px;object-fit:contain;background:#fffaf0;border-radius:50%;border:2px solid var(--gold);padding:3px;flex:none;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:150;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(12,17,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;}
  .modal{background:var(--paper-raised);border-radius:14px;padding:24px;max-width:520px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line);}
  .modal h3{margin-bottom:6px;}
  .modal p{color:var(--ink-soft);font-size:13.5px;margin:0 0 14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

  footer.note{margin-top:36px;display:flex;align-items:center;gap:8px;color:var(--ink-faint);font-size:12px;}

  /* ---------- draw stage (fixed dramatic palette, independent of theme) ---------- */
  .stage-backdrop{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;
    background:radial-gradient(ellipse 120% 90% at 50% 18%, var(--stage-bg2) 0%, var(--stage-bg) 68%);color:var(--stage-ink);}
  .stage-watermark{position:absolute;inset:0;background-repeat:no-repeat;background-position:center 40%;background-size:min(64vw,520px);opacity:.07;pointer-events:none;}
  .stage-mute, .stage-close-x{position:absolute;top:18px;background:rgba(255,255,255,.07);border:1px solid var(--stage-line);color:var(--stage-ink);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;}
  .stage-mute{left:18px;} .stage-close-x{right:18px;}
  .stage-mute:hover, .stage-close-x:hover{background:rgba(255,255,255,.15);}
  .stage-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:560px;width:100%;}
  .stage-backdrop-photo{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(48px) saturate(1.2) brightness(.5);opacity:.7;transform:scale(1.08);pointer-events:none;}
  .stage-photo{width:clamp(180px,30vw,264px);height:clamp(180px,30vw,264px);border-radius:50%;border:4px solid var(--stage-gold);overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);box-shadow:0 0 0 10px rgba(240,201,74,.14), 0 24px 60px -16px rgba(0,0,0,.7);}
  .stage-photo.small{width:clamp(120px,20vw,158px);height:clamp(120px,20vw,158px);}
  .stage-photo img{width:100%;height:100%;object-fit:cover;}
  .stage-ph{color:var(--stage-gold);opacity:.6;}
  .stage-order{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--stage-gold);font-weight:700;}
  .stage-name{font-family:var(--font-display);font-size:clamp(22px,4vw,32px);color:var(--stage-ink);}
  .stage-hint{font-size:13px;color:rgba(245,239,224,.65);}
  .stage-number{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(56px,14vw,120px);line-height:1;letter-spacing:.01em;}
  .stage-number.rolling{color:var(--stage-gold);text-shadow:0 0 26px rgba(240,201,74,.5);}
  .stage-number.revealed{color:var(--stage-red);text-shadow:0 0 34px rgba(239,75,86,.55);animation:stagePop .5s cubic-bezier(.2,1.6,.4,1);}
  .stage-number.pulse{animation:countPulse .5s cubic-bezier(.3,1.5,.4,1);}
  .stage-number.thump{animation:thump .14s ease-out;}
  @keyframes stagePop{ from{transform:scale(.6);opacity:0;} to{transform:scale(1);opacity:1;} }
  @keyframes countPulse{ 0%{transform:scale(.5);opacity:.25;} 55%{transform:scale(1.2);opacity:1;} 100%{transform:scale(1);opacity:1;} }
  @keyframes thump{ 0%{transform:scale(1.15);} 100%{transform:scale(1);} }
  .stage-content .stamp{border-color:var(--stage-red);color:var(--stage-red);font-size:14px;padding:6px 16px;}
  .stage-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .stage-content .btn{background:rgba(255,255,255,.06);border-color:rgba(245,239,224,.28);color:var(--stage-ink);}
  .stage-content .btn:hover:not(:disabled){border-color:var(--stage-gold);background:rgba(255,255,255,.13);}
  .stage-content .btn-red{background:var(--stage-red);border-color:var(--stage-red);color:#1a0405;}
  .stage-content .btn-primary{background:var(--stage-blue);border-color:var(--stage-blue);color:#051325;}
  .stage-content .btn-good{background:var(--stage-good);border-color:var(--stage-good);color:#062015;}
  .stage-content.revealed-in{animation:contentShake .45s ease;}
  @keyframes contentShake{ 0%{transform:translate(0,0);} 20%{transform:translate(-7px,0);} 40%{transform:translate(7px,0);} 60%{transform:translate(-4px,0);} 80%{transform:translate(4px,0);} 100%{transform:translate(0,0);} }

  .stage-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%, rgba(240,201,74,.6), transparent 62%);animation:flashOut .6s ease-out forwards;pointer-events:none;z-index:1;}
  @keyframes flashOut{ 0%{opacity:1;} 100%{opacity:0;} }
  .confetti-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
  .confetti{position:absolute;top:-8%;width:8px;height:14px;opacity:.9;border-radius:2px;animation-name:confettiFall;animation-timing-function:ease-in;animation-fill-mode:forwards;}
  .confetti.c-blue{background:var(--stage-blue);} .confetti.c-red{background:var(--stage-red);} .confetti.c-gold{background:var(--stage-gold);}
  @keyframes confettiFall{ 0%{transform:translateY(0) rotate(0deg);opacity:1;} 100%{transform:translateY(112vh) rotate(540deg);opacity:0;} }

  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  @media print{
    body{background:#fff;}
    .topbar-actions, .tabs, .btn, footer.note, .stage-backdrop{display:none !important;}
    .app{max-width:100%;padding:0;}
    .ticket{box-shadow:none;break-inside:avoid;}
    :root{--paper:#fff;--paper-raised:#fff;--ink:#111;}
  }
</style>

<div id="masthead"></div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- persistence ----------
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var id = uid();
    return { currentId: id, raffles: { } , order:[id]};
  }
  function saveStore(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ toast("Não foi possível salvar (armazenamento indisponível)."); }
  }
  function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function blankRaffle(){
    var id = uid();
    return {
      id: id,
      criadoEm: new Date().toISOString(),
      titulo: "",
      descricao: "",
      premios: [],
      numeros: [],
      resultados: [],
      pronto: false
    };
  }

  var store = loadStore();
  if(!store.raffles) store.raffles = {};
  if(!store.order) store.order = Object.keys(store.raffles);
  if(!store.currentId || !store.raffles[store.currentId]){
    var fresh = blankRaffle();
    store.raffles[fresh.id] = fresh;
    store.order.push(fresh.id);
    store.currentId = fresh.id;
    saveStore();
  }

  var activeTab = "configurar"; // configurar | sortear | resultados
  var menuOpen = null; // 'raffles' | 'more' | null
  var modal = null; // {type:'backup'|'restore'|'confirm', ...}
  var poolView = false; // show full pool grid
  var stage = null; // {pid, phase:'ready'|'rolling'|'revealed', winner}
  var soundOn = true;
  var rollGeneration = 0;

  function current(){ return store.raffles[store.currentId]; }

  // ---------- number parsing ----------
  function parseTokens(text){
    var out = [];
    var invalid = 0;
    var tokens = String(text||"").split(/[;,\s]+/).filter(Boolean);
    tokens.forEach(function(tok){
      var m = tok.match(/^(\d+)\s*-\s*(\d+)$/);
      if(m){
        var a = parseInt(m[1],10), b = parseInt(m[2],10);
        if(a>b){ var t=a; a=b; b=t; }
        if(b-a > 50000){ invalid++; return; }
        for(var i=a;i<=b;i++) out.push(i);
      } else if(/^\d+$/.test(tok)){
        out.push(parseInt(tok,10));
      } else {
        invalid++;
      }
    });
    return { numbers: out, invalid: invalid };
  }
  function unionInto(raffle, numbers){
    var set = new Set(raffle.numeros);
    numbers.forEach(function(n){ set.add(n); });
    raffle.numeros = Array.from(set).sort(function(a,b){return a-b;});
  }
  function subtractFrom(raffle, numbers){
    var remove = new Set(numbers);
    raffle.numeros = raffle.numeros.filter(function(n){ return !remove.has(n); });
  }
  function compressRanges(nums){
    if(!nums.length) return "";
    var sorted = nums.slice().sort(function(a,b){return a-b;});
    var parts = [];
    var start = sorted[0], prev = sorted[0];
    for(var i=1;i<sorted.length;i++){
      if(sorted[i] === prev+1){ prev = sorted[i]; continue; }
      parts.push(start===prev ? (""+start) : (start+"–"+prev));
      start = sorted[i]; prev = sorted[i];
    }
    parts.push(start===prev ? (""+start) : (start+"–"+prev));
    return parts.join(", ");
  }

  // ---------- image resize ----------
  function readAndResize(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 480;
        var scale = Math.min(1, maxW/img.width);
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        cb(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  // ---------- sound (synthesized, no external assets) ----------
  var audioCtx = null;
  function ensureAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function playTick(freq, dur, type, peak){
    if(!soundOn) return;
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = type||'square'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(peak||0.07, ctx.currentTime+0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+(dur||0.05));
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+(dur||0.05)+0.02);
    }catch(e){}
  }
  function playReveal(){
    if(!soundOn) return;
    playTick(660,0.12,'sine',0.09);
    setTimeout(function(){ playTick(880,0.16,'sine',0.1); }, 90);
    setTimeout(function(){ playTick(1320,0.22,'sine',0.11); }, 190);
  }
  var droneOsc=null, droneGain=null;
  function startDrone(){
    if(!soundOn) return;
    var ctx = ensureAudio(); if(!ctx) return;
    try{
      droneOsc = ctx.createOscillator(); droneGain = ctx.createGain();
      droneOsc.type = 'sine'; droneOsc.frequency.setValueAtTime(58, ctx.currentTime);
      droneOsc.frequency.linearRampToValueAtTime(96, ctx.currentTime+4.2);
      droneGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      droneGain.gain.exponentialRampToValueAtTime(0.045, ctx.currentTime+1.1);
      droneOsc.connect(droneGain); droneGain.connect(ctx.destination);
      droneOsc.start();
    }catch(e){}
  }
  function stopDrone(){
    if(!droneOsc) return;
    try{
      var ctx = audioCtx, o = droneOsc, g = droneGain;
      if(ctx && g) g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.25);
      setTimeout(function(){ try{ o.stop(); }catch(e){} }, 300);
    }catch(e){}
    droneOsc = null; droneGain = null;
  }

  function iconRedo(size){ size=size||14; return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'; }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(iso){ try{ var d = new Date(iso); return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ""; } }

  // ==================================================================
  // RENDER
  // ==================================================================
  function render(){
    var r = current();
    document.getElementById('masthead').innerHTML = renderMasthead(r);
    var app = document.getElementById('app');
    app.innerHTML =
      renderTabs(r) +
      '<main id="view">' + (
        activeTab === 'configurar' ? renderConfigurar(r) :
        activeTab === 'sortear' ? renderSortear(r) :
        renderResultados(r)
      ) + '</main>' +
      '<footer class="note">'+iconTicket(14)+' Estes dados ficam salvos apenas neste navegador — use "Fazer backup" para guardar uma cópia.</footer>' +
      renderModal() +
      renderStage(r);
    bindEvents();
  }

  function raffleStatusLabel(r){
    if(!r.pronto) return "Em configuração";
    if(r.resultados.length===0) return "Pronto para sortear";
    var validados = r.resultados.filter(function(x){return x.validado;}).length;
    if(validados < r.premios.length) return validados+"/"+r.premios.length+" validados";
    return "Concluído";
  }

  function renderMasthead(r){
    return '<div class="masthead">'+
      '<div class="masthead-watermark" style="background-image:url(\''+LOGO_DATA_URI+'\')" aria-hidden="true"></div>'+
      '<div class="brand">'+
        '<div class="brand-icon"><img src="'+LOGO_DATA_URI+'" alt="Brasão do Encontro de Casais com Cristo"></div>'+
        '<div class="brand-text"><div class="eyebrow">Sorteio da Ação</div><h1>'+esc(r.titulo || "Novo sorteio")+'</h1></div>'+
      '</div>'+
      '<div class="topbar-actions">'+
        '<button class="btn" data-action="toggle-menu" data-menu="raffles">'+iconTicket(15)+' Sorteios '+iconChevron(13)+'</button>'+
        (menuOpen==='raffles' ? renderRafflesMenu() : '')+
        '<button class="btn btn-icon" data-action="toggle-menu" data-menu="more" aria-label="Mais opções">'+iconMore(17)+'</button>'+

    var html = '<div class="menu-panel">'+

      if(!r) return;

        '<button class="menu-item" style="flex:1" data-action="switch-raffle" data-id="'+id+'">'+
          '<span class="raffle-meta"><span class="rname">'+esc(r.titulo||"Sem título")+'</span><br><span class="rstat">'+raffleStatusLabel(r)+'</span></span>'+

      '</div>';
    });
    html += '<div class="menu-sep"></div>'+
      '<button class="menu-item" data-action="new-raffle">'+iconPlus(15)+' Novo sorteio</button>'+
    '</div>';

  function renderMoreMenu(){
    return '<div class="menu-panel">'+
      '<button class="menu-item" data-action="open-backup">'+iconCopy(15)+' Fazer backup</button>'+
      '<button class="menu-item" data-action="open-restore">'+iconPlus(15)+' Restaurar backup</button>'+
    '</div>';
  }

  function renderTabs(r){
    var t2disabled = !r.pronto;
    var t3disabled = r.resultados.length===0;
    function tab(key, num, label, disabled){
      return '<button class="tab'+(activeTab===key?' active':'')+'" data-action="set-tab" data-tab="'+key+'" '+(disabled?'disabled':'')+'>'+
        '<span class="tab-num">'+num+'</span>'+label+'</button>';
    }
    return '<nav class="tabs">'+
      tab('configurar','1','Configurar', false)+
      tab('sortear','2','Sortear', t2disabled)+
      tab('resultados','3','Resultados', t3disabled)+
    '</nav>';
  }

  // ---------------- CONFIGURAR ----------------
  function renderConfigurar(r){
    var totalNums = r.numeros.length + r.resultados.length;
    var warn = "";
    if(r.premios.length && totalNums && totalNums < r.premios.length){
      warn = '<div class="banner banner-warn">⚠ Você tem '+totalNums+' número(s) para '+r.premios.length+' prêmio(s) — nem todos os prêmios poderão ser sorteados.</div>';
    }
    return '<div class="stack">'+

      '<section class="card stack">'+
        '<div class="section-title">Identificação do sorteio</div>'+
        '<div class="field"><label for="f-titulo">Nome do sorteio</label>'+
          '<input type="text" id="f-titulo" placeholder="Ex.: Ação da Fé — Encontro ECC 2026" value="'+esc(r.titulo)+'"></div>'+
        '<div class="field"><label for="f-desc">Descrição <span class="hint">(opcional)</span></label>'+
          '<textarea id="f-desc" style="font-family:var(--font-body);min-height:56px" placeholder="Detalhes do sorteio, data da entrega dos prêmios, etc.">'+esc(r.descricao)+'</textarea></div>'+
      '</section>'+

      '<section class="card stack">'+
        '<div class="section-title">Prêmios ('+r.premios.length+')</div>'+
        '<div class="stack" id="prizes-list" style="gap:10px">'+
          r.premios.map(function(p, i){
            return '<div class="prize-edit-row" data-pid="'+p.id+'">'+
              '<div class="prize-order">'+(i+1)+'</div>'+
              '<div class="prize-photo">'+
                (p.foto ? '<img src="'+p.foto+'" alt="">' : '<span class="ph">'+iconTicket(22)+'</span>')+
                '<input type="file" accept="image/*" data-action="prize-photo" data-pid="'+p.id+'" aria-label="Adicionar foto do prêmio">'+
              '</div>'+
              '<input type="text" placeholder="Nome do prêmio" value="'+esc(p.nome)+'" data-action="prize-name" data-pid="'+p.id+'">'+
              '<button class="btn btn-ghost btn-icon btn-wine" data-action="prize-remove" data-pid="'+p.id+'" aria-label="Remover prêmio">'+iconTrash(16)+'</button>'+
            '</div>';
          }).join('') +
        '</div>'+
        '<button class="btn" data-action="prize-add">'+iconPlus(15)+' Adicionar prêmio</button>'+
      '</section>'+

      '<section class="card stack">'+
        '<div class="section-title">Números disponíveis</div>'+
        '<div class="pool-summary">'+
          '<div class="pool-stat"><div class="num">'+totalNums+'</div><div class="lab">no total</div></div>'+
          '<div class="pool-stat"><div class="num">'+r.numeros.length+'</div><div class="lab">disponíveis</div></div>'+
          '<div class="pool-stat"><div class="num">'+r.resultados.length+'</div><div class="lab">já sorteados</div></div>'+
        '</div>'+
        (r.numeros.length ? (
          poolView ?
            '<div class="pool-grid">'+r.numeros.map(function(n){return '<div class="pool-chip">'+n+'</div>';}).join('')+'</div>'+
            '<button class="btn btn-ghost btn-sm" data-action="toggle-pool-view">Ocultar lista completa</button>'
          :
            '<div class="pool-ranges">'+esc(compressRanges(r.numeros))+'</div>'+
            '<button class="btn btn-ghost btn-sm" data-action="toggle-pool-view">Ver lista completa</button>'
        ) : '<div class="hint">Nenhum número adicionado ainda.</div>') +

        '<div class="row" style="margin-top:6px">'+
          '<div class="field">'+
            '<label for="f-list">Adicionar por lista</label>'+
            '<textarea id="f-list" placeholder="Ex.: 1;2;3;10;25 (separe por ponto e vírgula)"></textarea>'+
            '<button class="btn btn-sm" data-action="add-list">'+iconPlus(13)+' Adicionar à lista</button>'+
          '</div>'+
          '<div class="field">'+
            '<label>Adicionar por intervalo</label>'+
            '<div class="row" style="gap:8px">'+
              '<input type="number" id="f-de" placeholder="De" style="min-width:0">'+
              '<input type="number" id="f-ate" placeholder="Até" style="min-width:0">'+
            '</div>'+
            '<button class="btn btn-sm" data-action="add-range">'+iconPlus(13)+' Adicionar intervalo</button>'+
            '<div class="hint">Também aceita intervalos direto na lista, ex.: 1-50;80;90-95</div>'+

        '</div>'+
        '<div class="field">'+

      warn +

  // ---------------- SORTEAR ----------------
  function renderSortear(r){
    var total = r.numeros.length + r.resultados.length;
    var pct = total ? Math.round(100*r.resultados.length/total) : 0;

    return '<div class="stack">'+
      '<section class="card">'+
        '<div class="row" style="align-items:center">'+
          '<div class="pool-summary" style="flex:1">'+
            '<div class="pool-stat"><div class="num">'+total+'</div><div class="lab">total</div></div>'+
            '<div class="pool-stat"><div class="num">'+r.resultados.length+'</div><div class="lab">sorteados</div></div>'+
            '<div class="pool-stat"><div class="num">'+r.numeros.length+'</div><div class="lab">restantes</div></div>'+
          '</div>'+
        '</div>'+
        '<div class="progress-track" style="margin-top:14px"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '</section>'+

      '<div class="stack" id="tickets-list" style="gap:14px">'+
        r.premios.map(function(p, i){ return renderTicket(r, p, i); }).join('') +
      '</div>'+

      (r.resultados.length ? '<div class="row" style="justify-content:flex-end"><button class="btn btn-ghost btn-wine" data-action="reset-draws">Reiniciar sorteio</button></div>' : '')+
    '</div>';
  }

  function renderTicket(r, p, idx){
    var res = r.resultados.find(function(x){ return x.premioId===p.id; });
    var body;
    if(res && res.validado){
      body = '<div class="ticket-status-row">'+
          '<span class="winner-badge"><span class="winner-num">'+res.numero+'</span><span class="winner-time">'+fmtDate(res.sorteadoEm)+'</span></span>'+
          '<span class="stamp stamp-good">Validado</span>'+
        '</div>'+
        '<button class="btn btn-ghost btn-sm" data-action="undo-draw" data-pid="'+p.id+'" style="align-self:flex-start">Desfazer sorteio</button>';
    } else if(res){
      body = '<div class="ticket-status-row">'+
          '<span class="winner-badge"><span class="winner-num">'+res.numero+'</span><span class="winner-time">'+fmtDate(res.sorteadoEm)+'</span></span>'+
          '<span class="stamp stamp-warn">Aguardando validação</span>'+
        '</div>'+
        '<div class="row" style="gap:8px">'+
          '<button class="btn btn-good btn-sm" data-action="result-validate" data-pid="'+p.id+'">'+iconCheck(13)+' Validar número</button>'+
          '<button class="btn btn-ghost btn-sm btn-wine" data-action="result-redo" data-pid="'+p.id+'">'+iconRedo(13)+' Refazer sorteio</button>'+
        '</div>';
    } else {
      var disabled = r.numeros.length===0;
      body = '<div class="ticket-status-row">'+
          '<span class="hint">'+(disabled?'Sem números disponíveis':'Aguardando sorteio')+'</span>'+
          '<button class="btn btn-red btn-sm" data-action="open-stage" data-pid="'+p.id+'" '+(disabled?'disabled':'')+'>'+iconTicket(14)+' Sortear</button>'+
        '</div>';
    }
    return '<div class="ticket" data-ticket="'+p.id+'">'+
      '<div class="ticket-stub">'+(p.foto ? '<img src="'+p.foto+'" alt="">' : '<span class="ph">'+iconTicket(28)+'</span>')+'</div>'+
      '<div class="ticket-body">'+
        '<span class="ticket-order">PRÊMIO '+(idx+1)+'</span>'+
        '<span class="ticket-name">'+esc(p.nome||'(sem nome)')+'</span>'+
        body+
      '</div>'+
    '</div>';
  }

  // ---------------- RESULTADOS ----------------
  function renderResultados(r){
    var validCount = r.resultados.filter(function(x){return x.validado;}).length;
    if(!validCount){
      if(r.resultados.length){
        return '<div class="empty card"><h3>Aguardando validação</h3><p>Você já sorteou '+r.resultados.length+' prêmio(s), mas nenhum número foi validado ainda. Volte à aba <strong>Sortear</strong> para conferir e validar cada número antes de divulgar o resultado.</p></div>';
      }
      return '<div class="empty card"><h3>Ainda não há resultados</h3><p>Vá até a aba <strong>Sortear</strong> para começar a sortear os prêmios.</p></div>';
    }
    var ordered = r.premios.map(function(p,i){
      var res = r.resultados.find(function(x){return x.premioId===p.id;});
      return {p:p, i:i, res:res};
    }).filter(function(x){return x.res && x.res.validado;});
    var naoSorteados = r.premios.length - r.resultados.length;
    var aguardando = r.resultados.length - validCount;

    return '<div class="stack">'+
      '<section class="card">'+
        '<div class="letterhead"><img src="'+LOGO_DATA_URI+'" alt=""><h2 style="font-size:22px">'+esc(r.titulo)+'</h2></div>'+
        (r.descricao ? '<p class="hint" style="margin:2px 0 14px">'+esc(r.descricao)+'</p>' : '<div style="height:10px"></div>')+
        '<div id="results-table">'+
          ordered.map(function(x){
            return '<div class="result-row">'+
              '<div class="result-thumb">'+(x.p.foto?'<img src="'+x.p.foto+'" alt="">':iconTicket(18))+'</div>'+
              '<div><div class="result-order">PRÊMIO '+(x.i+1)+'</div><div class="result-name">'+esc(x.p.nome)+'</div></div>'+
              '<div class="result-num">Nº '+x.res.numero+'</div>'+
            '</div>';
          }).join('')+
        '</div>'+
        (aguardando ? '<div class="banner banner-warn" style="margin-top:14px">'+aguardando+' prêmio(s) sorteado(s) aguardando validação — não aparecem aqui ainda.</div>' : '')+
        (naoSorteados ? '<div class="banner banner-warn" style="margin-top:10px">'+naoSorteados+' prêmio(s) ainda não sorteado(s).</div>' : '')+
      '</section>'+
      '<div class="row" style="justify-content:flex-end;gap:10px">'+
        '<button class="btn" data-action="copy-results">'+iconCopy(14)+' Copiar resultado</button>'+
        '<button class="btn" data-action="print-results">'+iconPrinter(14)+' Imprimir</button>'+
      '</div>'+
    '</div>';
  }

  // ---------------- DRAW STAGE ----------------
  function renderStage(r){
    if(!stage) return '';
    var premio = r.premios.find(function(p){return p.id===stage.pid;});
    if(!premio){ stage=null; return ''; }
    var idx = r.premios.findIndex(function(p){return p.id===stage.pid;});
    var pendentesAfter = r.premios.filter(function(p){ return p.id!==stage.pid && !r.resultados.some(function(x){return x.premioId===p.id;}); });
    var photoHtml = premio.foto ? '<img src="'+premio.foto+'" alt="">' : '<span class="stage-ph">'+iconTicket(48)+'</span>';
    var body;

    if(stage.phase==='ready'){
      body =
        '<div class="stage-photo">'+photoHtml+'</div>'+
        '<div class="stage-order">PRÊMIO '+(idx+1)+' DE '+r.premios.length+'</div>'+
        '<h2 class="stage-name">'+esc(premio.nome)+'</h2>'+
        '<div class="stage-hint">'+r.numeros.length+' número(s) concorrendo</div>'+
        '<div class="stage-actions">'+
          '<button class="btn" data-action="stage-close">Cancelar</button>'+
          '<button class="btn btn-red" data-action="stage-start">'+iconTicket(16)+' Sortear agora</button>'+
        '</div>';
    } else if(stage.phase==='countdown' || stage.phase==='rolling'){
      body =
        '<div class="stage-photo small">'+photoHtml+'</div>'+
        '<div class="stage-order">PRÊMIO '+(idx+1)+' DE '+r.premios.length+'</div>'+
        '<h2 class="stage-name">'+esc(premio.nome)+'</h2>'+
        '<div class="stage-number rolling" id="stage-number">···</div>'+
        '<button class="btn btn-sm" data-action="stage-skip">Pular</button>';
    } else {
      var revRes = r.resultados.find(function(x){return x.premioId===stage.pid;});
      var isValidated = !!(revRes && revRes.validado);
      body =
        '<div class="stage-photo">'+photoHtml+'</div>'+
        '<div class="stage-order">PRÊMIO '+(idx+1)+' DE '+r.premios.length+'</div>'+
        '<h2 class="stage-name">'+esc(premio.nome)+'</h2>'+
        '<div class="stage-number revealed" id="stage-number">'+stage.winner+'</div>'+
        '<span class="stamp">Ganhador</span>'+
        (isValidated ?
          '<div class="stage-actions">'+
            (pendentesAfter.length ? '<button class="btn btn-red" data-action="stage-next">Sortear próximo prêmio '+iconChevron(14)+'</button>' : '<button class="btn btn-primary" data-action="stage-results">Ver resultados</button>')+
            '<button class="btn" data-action="stage-close">Fechar</button>'+
          '</div>'
        :
          '<div class="stage-hint">Confira o número '+stage.winner+' na lista de bilhetes antes de continuar</div>'+
          '<div class="stage-actions">'+
            '<button class="btn btn-good" data-action="result-validate" data-pid="'+stage.pid+'">'+iconCheck(15)+' Validar número</button>'+
            '<button class="btn" data-action="result-redo" data-pid="'+stage.pid+'">'+iconRedo(15)+' Refazer sorteio</button>'+
          '</div>'
        );
    }

    return '<div class="stage-backdrop" role="dialog" aria-modal="true" aria-label="Palco do sorteio">'+
      (premio.foto ? '<div class="stage-backdrop-photo" style="background-image:url(\''+premio.foto+'\')" aria-hidden="true"></div>' : '')+
      '<div class="stage-watermark" style="background-image:url(\''+LOGO_DATA_URI+'\')"></div>'+
      (stage.phase==='revealed' ? '<div class="stage-flash" aria-hidden="true"></div>'+confettiHtml() : '')+
      '<button class="stage-mute" data-action="stage-mute" aria-label="'+(soundOn?'Desativar som':'Ativar som')+'">'+(soundOn?iconSoundOn(18):iconSoundOff(18))+'</button>'+
      '<button class="stage-close-x" data-action="stage-close" aria-label="Fechar palco">'+iconClose(20)+'</button>'+
      '<div class="stage-content'+(stage.phase==='revealed'?' revealed-in':'')+'">'+body+'</div>'+
    '</div>';
  }

  function confettiHtml(){
    if(reduceMotion) return '';
    var pieces = [];
    for(var i=0;i<20;i++){
      var left = Math.round(Math.random()*100);
      var delay = (Math.random()*0.4).toFixed(2);
      var dur = (1.8+Math.random()*1.3).toFixed(2);
      var colorClass = ['c-blue','c-red','c-gold'][i%3];
      pieces.push('<span class="confetti '+colorClass+'" style="left:'+left+'%;animation-delay:'+delay+'s;animation-duration:'+dur+'s"></span>');
    }
    return '<div class="confetti-wrap" aria-hidden="true">'+pieces.join('')+'</div>';
  }

  // ---------------- MODAL ----------------
  function renderModal(){
    if(!modal) return '';
    if(modal.type==='confirm'){
      return '<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal">'+
        '<h3>'+esc(modal.title)+'</h3><p>'+esc(modal.message)+'</p>'+
        '<div class="modal-actions">'+
          '<button class="btn btn-ghost" data-action="modal-cancel">Cancelar</button>'+
          '<button class="btn btn-red" data-action="modal-confirm">'+esc(modal.confirmLabel||'Confirmar')+'</button>'+
        '</div></div></div>';
    }
    if(modal.type==='backup'){
      var json = JSON.stringify(store);
      return '<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal">'+
        '<h3>Fazer backup</h3><p>Copie o texto abaixo e guarde-o. Você pode colá-lo em "Restaurar backup" depois.</p>'+
        '<textarea id="backup-text" readonly style="min-height:140px;font-size:11px" onclick="this.select()">'+esc(json)+'</textarea>'+
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-cancel">Fechar</button><button class="btn btn-primary" data-action="copy-backup">'+iconCopy(14)+' Copiar</button></div>'+
      '</div></div>';
    }
    if(modal.type==='restore'){
      return '<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal">'+
        '<h3>Restaurar backup</h3><p>Cole abaixo o texto de um backup salvo anteriormente. Isso substituirá os sorteios salvos neste navegador.</p>'+
        '<textarea id="restore-text" style="min-height:140px;font-size:11px" placeholder="Cole aqui o backup..."></textarea>'+
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-cancel">Cancelar</button><button class="btn btn-primary" data-action="do-restore">Restaurar</button></div>'+
      '</div></div>';
    }
    return '';
  }

  function confirmDialog(title, message, confirmLabel, onConfirm){
    modal = {type:'confirm', title:title, message:message, confirmLabel:confirmLabel, onConfirm:onConfirm};
    render();
  }

  // ==================================================================
  // EVENTS
  // ==================================================================
  function bindEvents(){
    document.querySelectorAll('[data-action]').forEach(function(el){
      var action = el.getAttribute('data-action');
      if(el.tagName==='INPUT' && el.type==='file') return; // handled via change below
      el.addEventListener('click', function(ev){ handleAction(action, el, ev); });
    });
    document.querySelectorAll('.modal').forEach(function(m){
      m.addEventListener('click', function(ev){ ev.stopPropagation(); });
    });
    document.querySelectorAll('input[type=file][data-action="prize-photo"]').forEach(function(el){
      el.addEventListener('change', function(){
        var file = el.files && el.files[0];
        if(!file) return;
        var pid = el.getAttribute('data-pid');
        readAndResize(file, function(dataUrl){
          if(!dataUrl){ toast('Não foi possível carregar a imagem.'); return; }
          var r = current();
          var p = r.premios.find(function(x){return x.id===pid;});
          if(p){ p.foto = dataUrl; saveStore(); render(); }
        });
      });
    });
    var titulo = document.getElementById('f-titulo');
    if(titulo) titulo.addEventListener('input', function(){ current().titulo = titulo.value; saveStore(); syncHeaderOnly(); });
    var desc = document.getElementById('f-desc');
    if(desc) desc.addEventListener('input', function(){ current().descricao = desc.value; saveStore(); });
    document.querySelectorAll('input[data-action="prize-name"]').forEach(function(el){
      el.addEventListener('input', function(){
        var r = current(); var p = r.premios.find(function(x){return x.id===el.getAttribute('data-pid');});
        if(p){ p.nome = el.value; saveStore(); }
      });
    });
  }

  function syncHeaderOnly(){
    var h1 = document.querySelector('.brand-text h1');
    if(h1) h1.textContent = current().titulo || 'Novo sorteio';
  }

  function handleAction(action, el){
    var r = current();
    switch(action){
      case 'toggle-menu': {
        var m = el.getAttribute('data-menu');
        menuOpen = (menuOpen===m) ? null : m;
        render();
        break;
      }
      case 'modal-backdrop': modal=null; render(); break;
      case 'modal-cancel': modal=null; render(); break;
      case 'modal-confirm': { var fn = modal && modal.onConfirm; modal=null; if(fn) fn(); render(); break; }

      case 'set-tab': activeTab = el.getAttribute('data-tab'); menuOpen=null; render(); break;

      case 'switch-raffle': store.currentId = el.getAttribute('data-id'); menuOpen=null; activeTab='configurar'; saveStore(); render(); break;
      case 'new-raffle': {
        var nr = blankRaffle();
        store.raffles[nr.id] = nr; store.order.push(nr.id); store.currentId = nr.id;
        menuOpen=null; activeTab='configurar'; saveStore(); render();
        break;
      }
      case 'delete-raffle': {
        var did = el.getAttribute('data-id');
        menuOpen = null;
        confirmDialog('Excluir sorteio', 'Tem certeza que deseja excluir "'+(store.raffles[did]?store.raffles[did].titulo||'Sem título':'')+'"? Essa ação não pode ser desfeita.', 'Excluir', function(){
          delete store.raffles[did];
          store.order = store.order.filter(function(x){return x!==did;});
          if(store.currentId===did){ store.currentId = store.order[0] || null; }
          if(!store.currentId){ var nr2 = blankRaffle(); store.raffles[nr2.id]=nr2; store.order.push(nr2.id); store.currentId=nr2.id; }
          saveStore();
        });
        break;
      }

      case 'open-backup': modal={type:'backup'}; menuOpen=null; render(); break;
      case 'open-restore': modal={type:'restore'}; menuOpen=null; render(); break;
      case 'copy-backup': {
        var ta = document.getElementById('backup-text');
        copyText(ta.value, 'Backup copiado!');
        break;
      }
      case 'do-restore': {
        var txt = document.getElementById('restore-text').value.trim();
        try{
          var parsed = JSON.parse(txt);
          if(!parsed || !parsed.raffles) throw new Error('formato inválido');
          store = parsed;
          if(!store.order) store.order = Object.keys(store.raffles);
          modal=null; saveStore(); toast('Backup restaurado.'); render();
        }catch(e){ toast('Backup inválido — verifique o texto colado.'); }
        break;
      }

      case 'prize-add': {
        r.premios.push({id:uid(), nome:'', foto:null});
        saveStore(); render();
        break;
      }
      case 'prize-remove': {
        var rpid = el.getAttribute('data-pid');
        r.premios = r.premios.filter(function(p){return p.id!==rpid;});
        r.resultados = r.resultados.filter(function(x){return x.premioId!==rpid;});
        saveStore(); render();
        break;
      }

      case 'add-list': {
        var listVal = document.getElementById('f-list').value;
        var parsedL = parseTokens(listVal);
        if(parsedL.numbers.length){ unionInto(r, parsedL.numbers); saveStore(); }
        toast(parsedL.numbers.length ? (parsedL.numbers.length+' número(s) adicionados.') + (parsedL.invalid?(' '+parsedL.invalid+' ignorado(s).'):'') : 'Nenhum número válido encontrado.');
        render();
        break;
      }
      case 'add-range': {
        var de = parseInt(document.getElementById('f-de').value,10);
        var ate = parseInt(document.getElementById('f-ate').value,10);
        if(isNaN(de) || isNaN(ate)){ toast('Informe os dois valores do intervalo.'); break; }
        if(de>ate){ var t=de; de=ate; ate=t; }
        if(ate-de>50000){ toast('Intervalo muito grande.'); break; }
        var arr=[]; for(var i=de;i<=ate;i++) arr.push(i);
        unionInto(r, arr); saveStore();
        toast(arr.length+' número(s) adicionados ('+de+'–'+ate+').');
        render();
        break;
      }
      case 'remove-numbers': {
        var remVal = document.getElementById('f-remove').value;
        var parsedR = parseTokens(remVal);
        var before = r.numeros.length;
        subtractFrom(r, parsedR.numbers);
        saveStore();
        toast((before-r.numeros.length)+' número(s) removido(s).');
        render();
        break;
      }
      case 'toggle-pool-view': poolView = !poolView; render(); break;

      case 'save-config': {
        if(!r.titulo || !r.titulo.trim()){ toast('Dê um nome ao sorteio antes de continuar.'); activeTab='configurar'; render(); break; }
        if(!r.premios.length || r.premios.every(function(p){return !p.nome.trim();})){ toast('Adicione ao menos um prêmio com nome.'); render(); break; }
        if(!r.numeros.length && !r.resultados.length){ toast('Adicione ao menos um número disponível.'); render(); break; }
        r.premios = r.premios.filter(function(p){ return p.nome.trim() || r.resultados.some(function(x){return x.premioId===p.id;}); });
        r.pronto = true;
        activeTab = 'sortear';
        saveStore(); render();
        break;
      }

      case 'open-stage': openStage(el.getAttribute('data-pid')); break;
      case 'stage-start': stageStart(); break;
      case 'stage-skip': skipRoll(); break;
      case 'stage-close': closeStage(); break;
      case 'stage-next': stageNext(); break;
      case 'stage-results': stage=null; activeTab='resultados'; render(); break;
      case 'stage-mute': soundOn=!soundOn; render(); break;

      case 'result-validate': {
        var valpid = el.getAttribute('data-pid');
        var valres = r.resultados.find(function(x){return x.premioId===valpid;});
        if(valres){ valres.validado = true; saveStore(); }
        render();
        break;
      }
      case 'result-redo': {
        var rdpid = el.getAttribute('data-pid');
        var rdres = r.resultados.find(function(x){return x.premioId===rdpid;});
        if(rdres){
          r.resultados = r.resultados.filter(function(x){return x.premioId!==rdpid;});
          saveStore();
          toast('Número '+rdres.numero+' descartado. Corrija a lista de números, se preciso, e sorteie de novo.');
        }
        if(stage && stage.pid===rdpid){ stopDrone(); stage=null; }
        render();
        break;
      }

      case 'undo-draw': {
        var upid = el.getAttribute('data-pid');
        var res = r.resultados.find(function(x){return x.premioId===upid;});
        if(res){
          r.numeros.push(res.numero); r.numeros.sort(function(a,b){return a-b;});
          r.resultados = r.resultados.filter(function(x){return x.premioId!==upid;});
          saveStore(); render();
        }
        break;
      }
      case 'reset-draws': {
        confirmDialog('Reiniciar sorteio', 'Todos os números sorteados voltarão para o grupo de disponíveis e o histórico de prêmios sorteados será apagado. Deseja continuar?', 'Reiniciar', function(){
          r.numeros = r.numeros.concat(r.resultados.map(function(x){return x.numero;})).sort(function(a,b){return a-b;});
          r.resultados = [];
          saveStore();
        });
        break;
      }

      case 'copy-results': copyText(resultsAsText(r), 'Resultado copiado!'); break;
      case 'print-results': window.print(); break;
    }
  }

  function copyText(text, okMsg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }).catch(function(){ fallbackCopy(text, okMsg); });
    } else { fallbackCopy(text, okMsg); }
  }
  function fallbackCopy(text, okMsg){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast(okMsg);
    }catch(e){ toast('Não foi possível copiar automaticamente.'); }
  }

  function resultsAsText(r){
    var lines = [];
    lines.push(r.titulo);
    if(r.descricao) lines.push(r.descricao);
    lines.push('');
    r.premios.forEach(function(p,i){
      var res = r.resultados.find(function(x){return x.premioId===p.id;});
      var sufixo = res ? (res.validado ? (' — Número '+res.numero) : ' — (aguardando validação)') : ' — (ainda não sorteado)';
      lines.push((i+1)+'. '+p.nome+sufixo);
    });
    lines.push('');
    lines.push('Realizado em '+fmtDate(new Date().toISOString()));
    return lines.join('\n');
  }

  // ---------------- DRAW STAGE LOGIC ----------------
  function openStage(pid){
    stage = { pid: pid, phase: 'ready', winner: null };
    render();
  }
  function closeStage(){
    rollGeneration++;
    stopDrone();
    stage = null;
    render();
  }
  function stageStart(){
    var r = current();
    if(!r.numeros.length){ toast('Não há mais números disponíveis.'); return; }
    var idx = Math.floor(Math.random()*r.numeros.length);
    var winner = r.numeros[idx];
    stage.winner = winner;
    var myGen = ++rollGeneration;
    if(reduceMotion){
      stage.phase = 'rolling';
      render();
      setTimeout(function(){ if(myGen===rollGeneration) finishRoll(winner); }, 550);
      return;
    }
    stage.phase = 'countdown';
    render();
    startDrone();
    runCountdown(myGen, r.numeros.slice(), winner);
  }
  function runCountdown(myGen, poolSnapshot, winner){
    var steps = [
      {text:'Preparando…', tone:null, hold:600},
      {text:'3', tone:240, hold:640},
      {text:'2', tone:300, hold:640},
      {text:'1', tone:380, hold:640}
    ];
    var i = 0;
    function step(){
      if(myGen!==rollGeneration) return;
      var el = document.getElementById('stage-number');
      if(!el) return;
      var s = steps[i];
      el.textContent = s.text;
      el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
      if(s.tone) playTick(s.tone, 0.14, 'sine', 0.09);
      i++;
      if(i<steps.length){ setTimeout(step, steps[i-1].hold); }
      else {
        setTimeout(function(){
          if(myGen!==rollGeneration) return;
          stage.phase = 'rolling';
          render();
          runRoll(myGen, poolSnapshot, winner);
        }, 400);
      }
    }
    step();
  }
  function runRoll(myGen, poolSnapshot, winner){
    var delay = 55, elapsed = 0, maxElapsed = 4200, minTicks = 18, tickCount = 0;
    function tick(){
      if(myGen!==rollGeneration) return;
      var el = document.getElementById('stage-number');
      if(!el) return;
      var rnd = poolSnapshot.length ? poolSnapshot[Math.floor(Math.random()*poolSnapshot.length)] : winner;
      el.textContent = String(rnd);
      el.classList.remove('thump'); void el.offsetWidth; el.classList.add('thump');
      playTick(Math.min(520, 170+(delay-55)*0.9+Math.random()*30), 0.035, 'square', 0.05);
      tickCount++; elapsed += delay;
      delay = Math.min(delay*1.12, 340);
      if(elapsed>=maxElapsed && tickCount>=minTicks){
        setTimeout(function(){
          if(myGen!==rollGeneration) return;
          var el3 = document.getElementById('stage-number');
          if(el3){ el3.textContent = String(winner); el3.classList.remove('thump'); void el3.offsetWidth; el3.classList.add('thump'); }
          setTimeout(function(){ if(myGen===rollGeneration) finishRoll(winner); }, 650);
        }, 320);
        return;
      }
      setTimeout(tick, delay);
    }
    tick();
  }
  function skipRoll(){
    if(!stage || (stage.phase!=='rolling' && stage.phase!=='countdown')) return;
    rollGeneration++;
    finishRoll(stage.winner);
  }
  function finishRoll(winner){
    var r = current();
    var idx = r.numeros.indexOf(winner);
    if(idx>-1) r.numeros.splice(idx,1);
    r.resultados.push({premioId: stage.pid, numero: winner, sorteadoEm: new Date().toISOString()});
    stage.phase = 'revealed';
    saveStore();
    stopDrone();
    playReveal();
    render();
  }
  function stageNext(){
    var r = current();
    var pendentes = r.premios.filter(function(p){ return !r.resultados.some(function(x){return x.premioId===p.id;}); });
    if(!pendentes.length){ stage=null; activeTab='resultados'; render(); return; }
    stage = { pid: pendentes[0].id, phase:'ready', winner:null };
    render();
  }

  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape'){
      if(stage){ if(stage.phase==='ready' || stage.phase==='revealed') closeStage(); }
      else if(modal){ modal=null; render(); }
      else if(menuOpen){ menuOpen=null; render(); }
    }
  });
  document.addEventListener('click', function(ev){
    if(menuOpen && !ev.target.closest('.topbar-actions')){ menuOpen=null; render(); }
  });

  render();
})();
</script>
